
# MCP (Model Context Protocol) 配置示例
# 参考 Trae IDE 官方文档调整格式

# GitHub MCP 配置
mcp:
  servers:
    - name: "github"
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-github"]
      env:
        GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"

